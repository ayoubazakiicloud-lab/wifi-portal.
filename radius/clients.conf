# /etc/freeradius/3.0/clients.conf  (à ajouter)
# Le Starlink est derrière un CGNAT : l'IP source vue par le serveur change.
# On accepte donc toute origine, protégée par un secret LONG et un pare-feu (voir README).
client ruijie_ap {
    ipv4addr  = 0.0.0.0/0
    secret    = CHANGE_MOI_secret_aleatoire_de_32_caracteres_minimum
    shortname = ruijie
}
